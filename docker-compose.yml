# ─────────────────────────────────────────────────────────────────────────────
# Viteseo platform — local development stack
#
#   docker compose up -d              start mysql + api + reverb
#   docker compose exec api php artisan migrate:fresh --seed
#   docker compose logs -f reverb
#
# The host's PHP is 8.3 but composer.lock requires 8.4, so artisan/composer must
# always run through `docker compose exec api …`, never on the host.
#
# The frontend is NOT containerised — run `npm run dev` in ./frontend (port 3000).
#
# NETWORKING. `api` and `reverb` deliberately use host networking so the DB_HOST
# in backend/.env stays `127.0.0.1:3308` — identical whether a command runs on
# the host or in a container, and identical to how the browser reaches Reverb.
# The trade-off is that they cannot use compose's DNS to reach `mysql:3306`;
# they go through the published 3308 port instead. Keep .env and the published
# port in sync if you change either.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.4
    container_name: viteseo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: viteseo_platform
      MYSQL_USER: viteseo
      MYSQL_PASSWORD: viteseo
    ports:
      # 3308, not 3306 — this machine also runs the legacy CRM's MySQL.
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Gates the `api` and `reverb` starts below. Without it both race the DB
      # and die on boot: Reverb reads the `cache` table for its restart signal
      # before serving, so a cold `up` used to crash it with a connection error.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      # Root context so the image can bake scraper/requirements.txt as the one
      # source of truth for the discovery engine's deps. .dockerignore denies
      # everything and allows only that file plus the Dockerfile.
      context: .
      dockerfile: docker/php/Dockerfile
    image: viteseo-php:8.4
    container_name: viteseo-api
    restart: unless-stopped
    # Run as the invoking developer so files artisan writes into the bind mount
    # (logs, caches, generated migrations) are owned by them and not by root.
    # Override in a root-level .env if your uid/gid is not 1000.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      # That uid has no /etc/passwd entry inside the container, so HOME would be
      # unset and composer would fail trying to write its cache to /.
      HOME: /tmp
    volumes:
      - ./backend:/app
      # The discovery engine, READ-ONLY. Mounted so the API container can inspect
      # and invoke it the same way the worker does; it is never written to from
      # here, and the scraper's own runtime state stays on the host.
      - ./scraper:/scraper:ro
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host", "0.0.0.0", "--port", "8001"]

  reverb:
    # Same image as `api` — only the command differs. Reverb needs the pcntl and
    # sockets extensions that ./docker/php/Dockerfile compiles in.
    build:
      # Root context so the image can bake scraper/requirements.txt as the one
      # source of truth for the discovery engine's deps. .dockerignore denies
      # everything and allows only that file plus the Dockerfile.
      context: .
      dockerfile: docker/php/Dockerfile
    image: viteseo-php:8.4
    container_name: viteseo-reverb
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./backend:/app
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    # Binds 127.0.0.1:8085 per REVERB_SERVER_HOST/PORT in backend/.env. Loopback
    # only: reaching the app over a LAN IP will connect to the API but fail every
    # WebSocket upgrade. Browse via localhost.
    command: ["php", "artisan", "reverb:start"]

  # ───────────────────────────────────────────────────────────────────────────
  # DISCOVERY WORKER — the on-demand execution path.
  #
  # Same image and mounts as `api`; only the command differs, exactly as `reverb`
  # does. It consumes ONLY the `discovery` queue, so an on-demand discovery run
  # can never be held up behind unrelated jobs, and unrelated jobs are never held
  # up behind a 15-minute nationwide sweep.
  #
  # WHY IT EXISTS AS A SERVICE: a dispatched job with no consumer is a silent
  # dead end. Defining the worker in compose is what makes "click Run Discovery"
  # actually start work rather than enqueue it forever.
  #
  # This is independent of the nightly `discover-all` cron, which is untouched.
  # ───────────────────────────────────────────────────────────────────────────
  worker:
    build:
      # Root context so the image can bake scraper/requirements.txt as the one
      # source of truth for the discovery engine's deps. .dockerignore denies
      # everything and allows only that file plus the Dockerfile.
      context: .
      dockerfile: docker/php/Dockerfile
    image: viteseo-php:8.4
    container_name: viteseo-worker
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./backend:/app
      - ./scraper:/scraper:ro
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    # --tries=1 IS DELIBERATE. A discovery job spends real money at a paid
    # provider; a retry would re-issue those requests. `ingestDiscovered` dedupes
    # the ROWS, but nothing can refund the calls, so a failed run is reported and
    # re-requested by a human rather than retried automatically.
    # --timeout=900 accommodates a bounded nationwide sweep across several tasks.
    command:
      ["php", "artisan", "queue:work", "--queue=discovery", "--tries=1", "--timeout=900", "--sleep=1"]

  # THE TRIGGER FOR WEBSITE INTELLIGENCE — AND ONLY FOR IT.
  #
  # `crm:enrich-websites` is registered on Laravel's schedule, but a registration is not a trigger:
  # nothing in this stack ran `schedule:run`, so the entry existed and never fired. That is the same
  # shape of bug the command itself was written to fix one level up — a pipeline that works and is
  # never asked — and it is why every discovered lead sat at "Not audited".
  #
  # WHY NOT `schedule:work`. Because `schedule:run` fires every DUE entry, not the one you wanted.
  # This database holds emails scheduled for 2026-07-19 and the sender has no age cap, so starting
  # Laravel's scheduler to get enrichment would also mail two-month-old drafts to real contacts.
  # Running the scheduler here is therefore not a smaller decision than it looks, and this service
  # deliberately does not make it: it invokes ONE command by name and can dispatch nothing else.
  #
  # NO QUEUE WORKER NEEDED. The command runs the engine as a synchronous subprocess and queues no
  # job — VERIFIED: a real tick audited four leads and left `jobs` untouched at 7 rows. So this needs
  # no `default` worker, and adding one is not a hidden prerequisite.
  #
  # OVERLAP IS STRUCTURALLY IMPOSSIBLE HERE — the loop is sequential, so the next tick cannot start
  # until the last one returns. The command also takes its own atomic lock, which is what protects it
  # from a second trigger (a cron entry, an operator) rather than from this loop.
  #
  # The sleep is the remainder of the interval, not a flat delay, so the cadence stays at 30 minutes
  # instead of drifting by however long each tick took. `|| true` keeps a failed tick from killing
  # the loop: the command already reports a non-zero exit without retrying, and its queues are
  # ordered so the next tick resumes exactly where this one stopped.
  enrichment:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: viteseo-php:8.4
    container_name: viteseo-enrichment
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./backend:/app
      - ./scraper:/scraper:ro
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          start=$$(date +%s)
          php artisan crm:enrich-websites || true
          elapsed=$$(( $$(date +%s) - start ))
          [ "$$elapsed" -lt 1800 ] && sleep $$(( 1800 - elapsed ))
        done

volumes:
  mysql-data:
